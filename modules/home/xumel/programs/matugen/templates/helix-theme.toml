# Helix 主题（matugen 模板，渲染到 ~/.config/helix/themes/matugen.toml）。
# 注册见 programs/matugen.nix；token 映射与 nixvim 动态主题
# （programs/nixvim/theme.nix）保持一致，随壁纸 / 明暗模式自动重写。
# 参考：InioX/matugen-themes 的 helix.toml（改为不透明 surface 底色）。

# ── 语法 ─────────────────────────────────────────────────────────────

"attribute" = { fg = "{{colors.tertiary.default.hex}}" }
"type" = { fg = "{{colors.primary.default.hex}}" }
"type.builtin" = { fg = "{{colors.primary.default.hex}}" }
"constructor" = { fg = "{{colors.primary.default.hex}}" }

"constant" = { fg = "{{colors.tertiary.default.hex}}" }
"constant.builtin" = { fg = "{{colors.tertiary.default.hex}}" }
"constant.character" = { fg = "{{colors.tertiary.default.hex}}" }
"constant.character.escape" = { fg = "{{colors.tertiary.default.hex}}" }
"constant.numeric" = { fg = "{{colors.tertiary.default.hex}}" }

"string" = { fg = "{{colors.tertiary.default.hex}}" }
"string.regexp" = { fg = "{{colors.tertiary.default.hex}}" }
"string.special" = { fg = "{{colors.tertiary.default.hex}}" }

"comment" = { fg = "{{colors.outline.default.hex}}", modifiers = ["italic"] }

"variable" = { fg = "{{colors.on_surface.default.hex}}" }
"variable.parameter" = { fg = "{{colors.on_surface.default.hex}}" }
"variable.builtin" = { fg = "{{colors.secondary.default.hex}}" }
"variable.other.member" = { fg = "{{colors.on_surface.default.hex}}" }

"label" = { fg = "{{colors.tertiary.default.hex}}" }

"punctuation" = { fg = "{{colors.outline.default.hex}}" }
"punctuation.delimiter" = { fg = "{{colors.outline.default.hex}}" }
"punctuation.special" = { fg = "{{colors.secondary.default.hex}}" }

"keyword" = { fg = "{{colors.secondary.default.hex}}" }
"keyword.control" = { fg = "{{colors.secondary.default.hex}}" }
"keyword.operator" = { fg = "{{colors.secondary.default.hex}}" }
"operator" = { fg = "{{colors.secondary.default.hex}}" }

"function" = { fg = "{{colors.primary.default.hex}}" }
"function.macro" = { fg = "{{colors.secondary.default.hex}}" }
"function.builtin" = { fg = "{{colors.secondary.default.hex}}" }

"tag" = { fg = "{{colors.primary.default.hex}}" }
"namespace" = { fg = "{{colors.primary.default.hex}}" }
"module" = { fg = "{{colors.primary.default.hex}}" }
"special" = { fg = "{{colors.primary.default.hex}}" }

# ── Markup ───────────────────────────────────────────────────────────

"markup.heading" = { fg = "{{colors.primary.default.hex}}", modifiers = ["bold"] }
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.list" = { fg = "{{colors.secondary.default.hex}}" }
"markup.quote" = { fg = "{{colors.outline.default.hex}}", modifiers = ["italic"] }
"markup.raw" = { fg = "{{colors.tertiary.default.hex}}" }
"markup.link.url" = { fg = "{{colors.primary.default.hex}}", modifiers = ["underlined"] }
"markup.link.text" = { fg = "{{colors.tertiary.default.hex}}" }
"markup.link.label" = { fg = "{{colors.tertiary.default.hex}}" }

# ── Diff ─────────────────────────────────────────────────────────────

"diff.plus" = { fg = "{{colors.tertiary.default.hex}}" }
"diff.delta" = { fg = "{{colors.secondary.default.hex}}" }
"diff.minus" = { fg = "{{colors.error.default.hex}}" }

# ── UI ───────────────────────────────────────────────────────────────

"ui.background" = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface.default.hex}}" }
"ui.background.separator" = { fg = "{{colors.outline_variant.default.hex}}" }
"ui.linenr" = { fg = "{{colors.outline.default.hex}}" }
"ui.linenr.selected" = { fg = "{{colors.primary.default.hex}}", modifiers = ["bold"] }
"ui.statusline" = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
"ui.statusline.inactive" = { fg = "{{colors.outline.default.hex}}", bg = "{{colors.surface_container_low.default.hex}}" }
"ui.statusline.normal" = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}", modifiers = ["bold"] }
"ui.popup" = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
"ui.window" = { fg = "{{colors.outline_variant.default.hex}}" }
"ui.help" = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
"ui.text" = { fg = "{{colors.on_surface.default.hex}}" }
"ui.text.focus" = { fg = "{{colors.primary.default.hex}}", modifiers = ["bold"] }
"ui.text.inactive" = { fg = "{{colors.outline.default.hex}}" }
"ui.text.directory" = { fg = "{{colors.primary.default.hex}}" }
"ui.virtual" = { fg = "{{colors.outline_variant.default.hex}}" }
"ui.virtual.ruler" = { bg = "{{colors.surface_container_high.default.hex}}" }
"ui.virtual.indent-guide" = { fg = "{{colors.surface_container_high.default.hex}}" }
"ui.virtual.inlay-hint" = { fg = "{{colors.outline.default.hex}}", bg = "{{colors.surface_container_low.default.hex}}" }
"ui.virtual.jump-label" = { fg = "{{colors.primary.default.hex}}", modifiers = ["bold"] }
"ui.virtual.whitespace" = { fg = "{{colors.outline_variant.default.hex}}" }
"ui.selection" = { bg = "{{colors.primary_container.default.hex}}" }
"ui.selection.primary" = { bg = "{{colors.primary_container.default.hex}}" }
"ui.cursor" = { modifiers = ["reversed"] }
"ui.cursor.primary" = { modifiers = ["reversed"] }
"ui.cursor.match" = { fg = "{{colors.on_tertiary_container.default.hex}}", bg = "{{colors.tertiary_container.default.hex}}" }
"ui.cursorline.primary" = { bg = "{{colors.surface_container_high.default.hex}}" }
"ui.highlight" = { bg = "{{colors.tertiary_container.default.hex}}" }
"ui.bufferline" = { fg = "{{colors.outline.default.hex}}", bg = "{{colors.surface_container_low.default.hex}}" }
"ui.bufferline.active" = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface.default.hex}}", underline = { color = "{{colors.primary.default.hex}}", style = "line" } }
"ui.bufferline.background" = { bg = "{{colors.surface_container_low.default.hex}}" }
"ui.menu" = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
"ui.menu.selected" = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
"ui.menu.scroll" = { fg = "{{colors.outline.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

# ── 诊断 ─────────────────────────────────────────────────────────────

"diagnostic.error" = { fg = "{{colors.error.default.hex}}", underline = { color = "{{colors.error.default.hex}}", style = "curl" } }
"diagnostic.warning" = { fg = "{{colors.tertiary.default.hex}}", underline = { color = "{{colors.tertiary.default.hex}}", style = "curl" } }
"diagnostic.info" = { fg = "{{colors.primary.default.hex}}", underline = { color = "{{colors.primary.default.hex}}", style = "curl" } }
"diagnostic.hint" = { fg = "{{colors.outline.default.hex}}", underline = { color = "{{colors.outline.default.hex}}", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

error = { fg = "{{colors.error.default.hex}}" }
warning = { fg = "{{colors.tertiary.default.hex}}" }
info = { fg = "{{colors.primary.default.hex}}" }
hint = { fg = "{{colors.outline.default.hex}}" }
